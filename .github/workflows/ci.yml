# DEVER TOWN — CI tối thiểu (Phase 0)
# Chạy build + verify scripts + Playwright (Chromium) mỗi push/PR vào develop_hung và main.
name: CI

on:
  push:
    branches: [develop_hung, main]
  pull_request:
    branches: [develop_hung, main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Node verify scripts
        run: |
          for f in test/verify_*.js; do
            echo "▶ $f"
            node "$f" || exit 1
          done

      - name: Install Playwright Chromium
        uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      - name: Install browser (cache miss)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Playwright e2e (Chromium)
        run: npx playwright test --project="Desktop Chromium"
        env:
          CI: true

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
