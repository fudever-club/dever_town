<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>DEVER TOWN - 2D Pixel Club World</title>
  <link rel="stylesheet" href="/src/styles/main.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="game-wrapper">
    <header id="ui-header">
      <div class="logo">
        <span class="badge">DEVER</span> TOWN
      </div>
      <div class="controls-hint">
        <span>🎮 Di chuyển: <b>WASD</b> hoặc <b>Phím Mũi Tên</b></span>
      </div>
      <div class="status-indicator">
        <span class="dot online"></span>
        <span class="status-text">Client Sẵn Sàng</span>
      </div>
    </header>

    <main id="game-container"></main>

    <footer id="ui-footer">
      <div class="tip">💡 Mẹo: Nhân vật không thể đi xuyên qua tường gạch, giá sách và viền bản đồ.</div>
    </footer>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
